services:
  legacy-mysql:
    image: mysql:5.7
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - legacy_db_data:/var/lib/mysql
      - ./backups/legacy_db_backup.sql.gz:/docker-entrypoint-initdb.d/legacy_db_backup.sql.gz:ro
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  legacy_db_data:
