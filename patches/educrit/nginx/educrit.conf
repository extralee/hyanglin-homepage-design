server {
    listen 80;
    server_name educrit.org www.educrit.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    include /etc/nginx/conf.d/security-headers.inc;
    include /etc/nginx/conf.d/sql-waf.inc;
    server_name educrit.org www.educrit.org;

    ssl_certificate     /etc/letsencrypt/live/educrit.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/educrit.org/privkey.pem;

    client_max_body_size 50M;

    add_header Content-Security-Policy "upgrade-insecure-requests;";
    server_tokens off;

    access_log /var/log/nginx/educrit.access.log security;
    error_log  /var/log/nginx/educrit.error.log warn;

    location / {
        proxy_pass         http://host.docker.internal:8084;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;

        proxy_set_header   Accept-Encoding "";
        sub_filter "http://www.educrit.org" "https://www.educrit.org";
        sub_filter "http://educrit.org" "https://www.educrit.org";
        sub_filter_once off;
        sub_filter_types text/css text/xml application/javascript;
    }
}
