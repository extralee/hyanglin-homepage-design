server {
    listen 80;
    server_name cinemabucketlist.com www.cinemabucketlist.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    include /etc/nginx/conf.d/security-headers.inc;
    include /etc/nginx/conf.d/sql-waf.inc;
    server_name cinemabucketlist.com www.cinemabucketlist.com;

    ssl_certificate     /etc/letsencrypt/live/cinemabucketlist.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cinemabucketlist.com/privkey.pem;

    client_max_body_size 50M;

    add_header Content-Security-Policy "upgrade-insecure-requests;";
    server_tokens off;
    location ~* /(?:config\.php|db\.config\.php|\.git|\.env|\.sql|\.bak|\.tar|\.gz)$ { return 404; }

    access_log /var/log/nginx/cinemabucketlist.access.log combined;
    error_log  /var/log/nginx/cinemabucketlist.error.log warn;

    # phpMyAdmin 관리자 IP 화이트리스트 (구형 PHP/MySQL 관리용 유지)
    location ~* ^/phpMyAdmin {
        include /etc/nginx/conf.d/phpmyadmin-whitelist.inc;

        proxy_pass         http://host.docker.internal:8090;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_redirect     http:// https://;
    }

    # Legacy XE Site Proxy (구버전 XE 사이트 열람 전용: /home, /schedule, /contents)
    location ~* ^/(?:home|schedule|contents) {
        proxy_pass         http://host.docker.internal:8090;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_redirect     http:// https://;
    }

    # Legacy Movie Explorer Proxy (구버전 영화 탐색기 열람: /old-movies -> /movies)
    location /old-movies/ {
        rewrite ^/old-movies/(.*) /movies/$1 break;
        proxy_pass         http://host.docker.internal:8090;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_redirect     http:// https://;
    }

    # Next.js Static Asset Caching
    location /_next/static/ {
        proxy_pass         http://host.docker.internal:8092;
        proxy_set_header   Host $host;
        expires 365d;
        access_log off;
    }

    # Next.js Fullstack Modern App (포트 8092)
    location / {
        proxy_pass         http://host.docker.internal:8092;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_redirect     http:// https://;
        proxy_cache_bypass $http_upgrade;
    }
}
