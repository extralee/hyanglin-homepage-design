server {
    listen 80;
    server_name cinemabucketlist.com www.cinemabucketlist.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    include /etc/nginx/conf.d/security-headers.inc;
    include /etc/nginx/conf.d/sql-waf.inc;
    server_name cinemabucketlist.com www.cinemabucketlist.com;

    ssl_certificate     /etc/letsencrypt/live/cinemabucketlist.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cinemabucketlist.com/privkey.pem;

    client_max_body_size 50M;

    add_header Content-Security-Policy "upgrade-insecure-requests;";
    server_tokens off;
    location ~* /(?:config\.php|db\.config\.php|\.git|\.env|\.sql|\.bak|\.tar|\.gz)$ { return 404; }

    access_log /var/log/nginx/cinemabucketlist.access.log combined;
    error_log  /var/log/nginx/cinemabucketlist.error.log warn;

    # phpMyAdmin 관리자 IP 화이트리스트 (phpmyadmin-whitelist.inc에서 관리)
    # IP 추가/제거는 phpmyadmin-whitelist.inc 파일만 수정 후 nginx reload
    location ~* ^/phpMyAdmin {
        include /etc/nginx/conf.d/phpmyadmin-whitelist.inc;

        proxy_pass         http://host.docker.internal:8090;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_redirect     http:// https://;
    }

    location / {
        proxy_pass         http://host.docker.internal:8090;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_redirect     http:// https://;

        proxy_set_header   Accept-Encoding "";
        sub_filter "http://www.cinemabucketlist.com" "https://www.cinemabucketlist.com";
        sub_filter "http://cinemabucketlist.com" "https://cinemabucketlist.com";
        sub_filter_once off;
        sub_filter_types text/html text/css text/xml application/javascript;
    }
}
