server {
    listen 80;
    server_name b-book.co.kr www.b-book.co.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name b-book.co.kr www.b-book.co.kr;

    ssl_certificate     /etc/letsencrypt/live/b-book.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/b-book.co.kr/privkey.pem;

    client_max_body_size 50M;

    add_header Content-Security-Policy "upgrade-insecure-requests;";
    server_tokens off;
location ~* /(?:config\.php|db\.config\.php|\.git|\.env|\.sql|\.bak|\.tar|\.gz)$ {        return 404;    }

    access_log /var/log/nginx/b-book.access.log combined;
    error_log  /var/log/nginx/b-book.error.log warn;

    location / {
        proxy_pass         http://host.docker.internal:8089;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_redirect     http:// https://;

        proxy_set_header   Accept-Encoding "";
        sub_filter "http://www.b-book.co.kr" "https://www.b-book.co.kr";
        sub_filter "http://b-book.co.kr" "https://b-book.co.kr";
        sub_filter_once off;
        sub_filter_types text/html text/css text/xml application/javascript;
    }
}
