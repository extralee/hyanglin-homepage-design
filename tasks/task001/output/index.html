<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>향린교회 레거시 데이터 대시보드</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --sidebar-bg: rgba(30, 41, 59, 0.7);
            --card-bg: rgba(51, 65, 85, 0.5);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            overflow: hidden;
            background-image:
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
        }

        /* Sidebar Styling */
        .sidebar {
            width: 320px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-right: 1px solid var(--border-color);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            z-index: 10;
            box-shadow: 4px 0 24px rgba(0, 0, 0, 0.2);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            letter-spacing: -0.5px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #38bdf8, #8b5cf6);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .nav-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-secondary);
            padding: 1rem 1.25rem;
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .nav-btn .desc {
            font-size: 0.8rem;
            opacity: 0.7;
            font-weight: 400;
        }

        .nav-btn:hover {
            background: var(--card-bg);
            color: var(--text-primary);
            transform: translateX(4px);
        }

        .nav-btn.active {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.1), rgba(139, 92, 246, 0.1));
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: var(--accent-color);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .nav-btn.active .desc {
            color: var(--text-primary);
        }

        /* Main Content Area */
        .main-content {
            flex: 1;
            position: relative;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
        }

        .iframe-container {
            flex: 1;
            background: #ffffff;
            /* Charts are usually white-bg */
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            position: relative;
            animation: fadeIn 0.5s ease-out;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--sidebar-bg);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <aside class="sidebar">
        <div class="logo">
            <div class="logo-icon">H</div>
            향린 레거시 데이터
        </div>

        <div class="nav-menu">
            <div class="nav-label">Data Visualizations</div>

            <button class="nav-btn active" onclick="loadChart('category_motion_chart.html', this)">
                카테고리 모션 차트
                <span class="desc">게시판별 동적 트래픽 흐름</span>
            </button>

            <button class="nav-btn" onclick="loadChart('traffic_bubble_chart.html', this)">
                트래픽 버블 차트
                <span class="desc">전체 게시판 트래픽 시각화</span>
            </button>

            <button class="nav-btn" onclick="loadChart('keyword_motion_chart.html', this)">
                키워드 모션 차트
                <span class="desc">연도별 핵심 키워드 트렌드</span>
            </button>

            <button class="nav-btn" onclick="loadChart('individual_traffic_charts.html', this)">
                개별 트래픽 차트
                <span class="desc">세부 게시판 트래픽 정밀 분석</span>
            </button>

            <button class="nav-btn" onclick="loadChart('analysis_report_view.html', this)">
                데이터 분석 리포트
                <span class="desc">다각도 분석 요약 (실시간 렌더링)</span>
            </button>

            <button class="nav-btn" onclick="loadChart('wordcloud_view.html', this)">
                전체 워드클라우드
                <span class="desc">가장 많이 쓰인 핵심 단어 한눈에 보기</span>
            </button>
        </div>
    </aside>

    <main class="main-content">
        <div class="iframe-container">
            <div class="loading-overlay" id="loader">
                <div class="spinner"></div>
            </div>
            <iframe id="chart-frame" src="category_motion_chart.html" onload="hideLoader()"></iframe>
        </div>
    </main>

    <script>
        function loadChart(url, btnElement) {
            // Update active state on buttons
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            // Show loader
            document.getElementById('loader').style.opacity = '1';

            // Change iframe src
            document.getElementById('chart-frame').src = url;
        }

        function hideLoader() {
            document.getElementById('loader').style.opacity = '0';
        }
    </script>
</body>

</html>
