server {
    listen 80;
    server_name www.hyanglin.org hyanglin.org;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.hyanglin.org hyanglin.org;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/www.hyanglin.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.hyanglin.org/privkey.pem;

    # 브라우저 레벨에서 모든 HTTP 이미지/자원을 HTTPS로 강제 자동 승격 (Mixed Content 완벽 방지)
    add_header Content-Security-Policy "upgrade-insecure-requests;";

    # 표준 SSL 보안 설정 (외부 include 파일 의존성 제거)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://host.docker.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # 혼합 콘텐츠(Mixed Content) 방지를 위한 HTTP -> HTTPS 이미지 주소 자동 변환
        sub_filter 'http://localhost:8080/' 'https://www.hyanglin.org/';
        sub_filter 'http://www.hyanglin.org/' 'https://www.hyanglin.org/';
        sub_filter 'http://hyanglin.org/' 'https://hyanglin.org/';
        sub_filter_once off;
        sub_filter_types text/css text/xml application/javascript;
    }
}
