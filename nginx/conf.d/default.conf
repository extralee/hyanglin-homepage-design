# ────────────────────────────────────────────────────────────
# 동적 PHP 전용 Rate Limiting (#44, #79, #80)
# 정적 파일(CSS/JS/이미지)은 별도 location에서 무제한 허용
# PHP/동적 요청만 IP당 초당 10회 + burst 20 제한
# ────────────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=php_limit:10m rate=10r/s;

# ────────────────────────────────────────────────────────────
# 해킹 탐지용 확장 로그 포맷 (IP, UA, 상태코드, Referer 포함)
# ────────────────────────────────────────────────────────────
log_format security '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    '$request_time';

server {
    listen 80;
    server_name www.hyanglin.org hyanglin.org;

    # 악성 및 과도한 크롤러 봇 L7 차단
    if ($http_user_agent ~* (meta-externalagent|facebookexternalhit|Bytespider|PetalBot|AhrefsBot|SemrushBot|GPTBot|KeenableBot|Amazonbot)) {
        return 403;
    }

    # 슬래시(//)를 2개 이상 연속으로 붙이거나 외부 절대 URL로 들어오는 우회 공격 차단
    if ($request_uri ~* "^/{2,}") {
        return 444;
    }
    if ($request_uri ~* "^https?://") {
        return 444;
    }

    server_tokens off;

    access_log /var/log/nginx/access.log security;
    error_log  /var/log/nginx/error.log warn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.hyanglin.org hyanglin.org;

    # 악성 및 과도한 크롤러 봇 L7 차단
    if ($http_user_agent ~* (meta-externalagent|facebookexternalhit|Bytespider|PetalBot|AhrefsBot|SemrushBot|GPTBot|KeenableBot|Amazonbot)) {
        return 403;
    }

    # 슬래시(//)를 2개 이상 연속으로 붙이거나 외부 절대 URL로 들어오는 우회 공격 차단
    if ($request_uri ~* "^/{2,}") {
        return 444;
    }
    if ($request_uri ~* "^https?://") {
        return 444;
    }

    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/www.hyanglin.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.hyanglin.org/privkey.pem;

    # 브라우저 레벨에서 모든 HTTP 이미지/자원을 HTTPS로 강제 자동 승격 (Mixed Content 완벽 방지)
    add_header Content-Security-Policy "upgrade-insecure-requests;";

    # SQL Injection WAF 연동 (#73, #79)
    include /etc/nginx/conf.d/sql-waf.inc;

    # ────────────────────────────────────────────────────────────
    # 악성 봇넷 쿼리 파라미터 L7 차단 (#79)
    # ────────────────────────────────────────────────────────────
    # 1) 회원 관리 폼 파라미터에 게시글 번호/검색어가 결합된 봇넷 요청 차단 (403)
    if ($query_string ~* "act=dispMember(SignUpForm|FindAccount|ResendAuthMail)&.*(document_srl|search_target|category)") {
        return 403;
    }
    if ($query_string ~* "(document_srl|search_target|category)=.*&act=dispMember(SignUpForm|FindAccount|ResendAuthMail)") {
        return 403;
    }

    # 2) 순수 불법/도박/성인/스팸 키워드 태그 검색 차단 (403, 일반 명사 제외)
    if ($query_string ~* "search_target=tag&.*search_keyword=.*(viagra|levitra|cialis|casino|poker|gambling|loan|porn|adult)") {
        return 403;
    }

    # 파일 업로드 용량 제한 설정 (50MB)
    client_max_body_size 50M;

    # 표준 SSL 보안 설정 (외부 include 파일 의존성 제거)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/access.log security;
    error_log  /var/log/nginx/error.log warn;

    # ────────────────────────────────────────────────────────
    # /bbs_old 아카이브 전용 보안 설정 (#67)
    # 기존 301 KT 리다이렉트 제거 → 가비아 내부 프록시 전환
    # ────────────────────────────────────────────────────────
    location ^~ /bbs_old/ {
        # 글쓰기/수정/업로드 등 모든 POST 요청 원천 차단 (조회 전용 아카이브)
        if ($request_method = POST) {
            return 403;
        }

        proxy_pass         http://host.docker.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;

        # 과거 본문 내 http:// 링크 및 구 KT IP 실시간 치환
        proxy_set_header   Accept-Encoding "";
        sub_filter "http://14.63.198.35/" "https://www.hyanglin.org/";
        sub_filter "http://www.hyanglin.org/" "https://www.hyanglin.org/";
        sub_filter "http://hyanglin.org/" "https://hyanglin.org/";
        sub_filter_once off;
        sub_filter_types text/html text/css text/xml application/javascript;
    }

    # bbs_old 첨부파일 디렉터리 내 PHP 악성 웹셸 실행 방지 (#67)
    location ~* ^/bbs_old/files/.*\.php$ {
        deny all;
    }

    # ────────────────────────────────────────────────────────────
    # 정적 파일 — Rate Limit 제외 + 7일 브라우저 캐싱 (#44, #79, #80)
    # CSS/JS/이미지/폰트는 브라우저 캐싱으로 백엔드 부하 80% 절감
    # ────────────────────────────────────────────────────────────
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot|pdf|mp4|mp3|swf|zip)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        add_header Content-Security-Policy "upgrade-insecure-requests;";

        proxy_pass http://host.docker.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        # 동적 PHP 요청만 Rate Limiting (#44, #79, #80)
        limit_req zone=php_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://host.docker.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header User-Agent $http_user_agent;

        # 혼합 콘텐츠(Mixed Content) 방지를 위한 HTTP -> HTTPS 이미지 주소 자동 변환
        sub_filter "http://localhost:8080/" "https://www.hyanglin.org/";
        sub_filter "http://www.hyanglin.org/" "https://www.hyanglin.org/";
        sub_filter "http://hyanglin.org/" "https://hyanglin.org/";
        sub_filter_once off;
        sub_filter_types text/css text/xml application/javascript;
    }
}
