server {
    listen 80;
    server_name www.hyanglin.org hyanglin.org;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.hyanglin.org hyanglin.org;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/www.hyanglin.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.hyanglin.org/privkey.pem;
    
    # Certbot이 생성할 SSL 설정 파일 로드
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        # 실제 웹 애플리케이션 프록시 (Next.js)
        proxy_pass http://web:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
