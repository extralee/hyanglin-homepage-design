server {
    listen 80;
    server_name www.hyanglin.org hyanglin.org;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.hyanglin.org hyanglin.org;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/www.hyanglin.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.hyanglin.org/privkey.pem;

    # 표준 SSL 보안 설정 (외부 include 파일 의존성 제거)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        # TODO: 실제 웹 애플리케이션(web) 소스 추가 시 주석 전환
        # proxy_pass http://web:3000;
        # proxy_set_header Host $http_host;
        # proxy_set_header X-Real-IP $remote_addr;
        # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        root /usr/share/nginx/html;
        index index.html index.htm;
    }
}
